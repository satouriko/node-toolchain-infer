name: Publish npm package
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, such as v0.1.0
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: npm-publish
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    with:
      ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
  publish:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    environment:
      name: npm
      url: https://www.npmjs.com/package/node-toolchain-infer
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - run: pnpm install --frozen-lockfile
      - name: Require a tag matching the package version
        id: release
        env:
          RELEASE_REF: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs'
          import semver from 'semver'
          const { name, version } = JSON.parse(readFileSync('package.json', 'utf8'))
          if (name !== 'node-toolchain-infer' || !semver.valid(version) || process.env.RELEASE_REF !== `refs/tags/v${version}`) {
            throw new Error('Run this workflow from the v<package.json version> tag.')
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\ntag=${semver.prerelease(version) ? 'next' : 'latest'}\n`)
          NODE
      - name: Build the publishable tarball
        run: pnpm pack --pack-destination .cache/release
      - name: Verify the tarball on Node 24
        run: pnpm exec tsx scripts/verify-package.ts .cache/release/*.tgz
      - uses: actions/setup-node@v7
        with:
          node-version: 18.20.8
          package-manager-cache: false
      - name: Verify the tarball on Node 18
        run: pnpm exec tsx scripts/verify-package.ts .cache/release/*.tgz
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: .cache/release/*.tgz
          if-no-files-found: error
      - name: Check for an identical existing publication
        id: registry
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto'
          import { readFileSync, appendFileSync } from 'node:fs'
          import { gunzipSync } from 'node:zlib'
          const version = process.env.VERSION
          const response = await fetch(`https://registry.npmjs.org/node-toolchain-infer/${version}`, { signal: AbortSignal.timeout(20000) })
          if (response.status === 404) {
            appendFileSync(process.env.GITHUB_OUTPUT, 'publish=true\n')
          } else {
            if (!response.ok) throw new Error(`Registry returned HTTP ${response.status}`)
            const published = await response.json()
            const packed = readFileSync(`.cache/release/node-toolchain-infer-${version}.tgz`)
            const integrity = bytes => `sha512-${createHash('sha512').update(bytes).digest('base64')}`
            if (published.dist?.integrity !== integrity(packed)) {
              const tarball = new URL(published.dist.tarball)
              if (tarball.origin !== 'https://registry.npmjs.org') throw new Error('Unexpected registry tarball origin.')
              const download = await fetch(tarball, { signal: AbortSignal.timeout(20000) })
              if (!download.ok) throw new Error(`Tarball download returned HTTP ${download.status}`)
              const released = Buffer.from(await download.arrayBuffer())
              if (integrity(released) !== published.dist.integrity) throw new Error('Downloaded tarball integrity does not match the registry.')
              if (!gunzipSync(released).equals(gunzipSync(packed))) throw new Error('This version already exists with different package bytes.')
            }
            console.log(`Verified byte-identical published tar contents for ${version}; no publish request is needed.`)
            appendFileSync(process.env.GITHUB_OUTPUT, 'publish=false\n')
          }
          NODE
      - name: Publish with npm trusted publishing
        if: steps.registry.outputs.publish == 'true'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: npm publish .cache/release/*.tgz --ignore-scripts --access public --provenance --tag "$RELEASE_TAG" --registry=https://registry.npmjs.org
      - name: Verify the published version
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: npm view "node-toolchain-infer@$VERSION" version dist.integrity --registry=https://registry.npmjs.org
