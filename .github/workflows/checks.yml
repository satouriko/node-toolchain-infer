name: Checks
on:
  push:
    branches-ignore: [compatibility-data]
  pull_request: {}
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
        default: ''
permissions:
  contents: read
jobs:
  checks:
    strategy:
      matrix:
        node: [18.20.8, '24']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm lint && pnpm build && pnpm website:build
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: pnpm test && pnpm data:validate
      - name: Exercise real frozen fixture installs on each runtime
        run: pnpm compat:test
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fixture-evidence-node-${{ matrix.node }}
          path: maintenance/evidence/
